name: Update DiKa RO feed
on:
  schedule:
    - cron: "17 2 * * *"   # 04:17 Sofia/Bucharest (winter) - before Merchant Center's 06:00 fetch
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python convert.py feed.tsv
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.tsv
          git diff --cached --quiet || git commit -m "Update feed $(date -u +%F)"
          git push
